<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hifty Mission Control</title>
<style>
:root{--bg:#000;--bg2:#0d0d0f;--bg3:#1c1c1e;--bg4:#2c2c2e;--bg5:#3a3a3c;--text:#fff;--text2:#98989d;--text3:#636366;--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--teal:#5AC8FA;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.12);--radius:14px;--radius2:9px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.4;font-size:14px;-webkit-font-smoothing:antialiased}
html,body{height:100%}
.dashboard{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;gap:14px;padding:14px;height:100vh;overflow:hidden}
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border)}
.sidebar{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:14px;overflow-y:auto}
.main{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.h-left{display:flex;align-items:center;gap:14px}
.h-title{font-size:17px;font-weight:600}
.h-url{font-size:11px;color:var(--text2);background:var(--bg3);padding:4px 9px;border-radius:5px}
.h-center{display:flex;align-items:center;gap:20px}
.h-clock{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.h-resources{display:flex;gap:14px}
.res-item{text-align:center}
.res-label{font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:3px}
.res-bar{width:50px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.res-fill{height:100%;border-radius:3px;transition:width 0.3s,background 0.3s}
.res-fill.low{background:var(--blue)}.res-fill.med{background:var(--orange)}.res-fill.high{background:var(--red)}
.h-right{display:flex;align-items:center;gap:10px}
.status-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:500}
.status-badge.connecting{background:rgba(255,149,0,0.15);color:var(--orange)}
.status-badge.connected{background:rgba(52,199,89,0.15);color:var(--green)}
.status-badge.disconnected{background:rgba(255,59,48,0.15);color:var(--red)}
.status-dot{width:7px;height:7px;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.s-logo{display:flex;align-items:center;gap:9px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.s-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.s-name{font-size:15px;font-weight:600}
.s-section{margin-bottom:16px}
.s-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding-left:4px}
.s-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius2);color:var(--text2);cursor:pointer;transition:all 0.15s;margin-bottom:3px}
.s-btn:hover{background:var(--bg3);color:var(--text)}
.s-btn.active{background:var(--blue);color:#fff}
.s-btn-icon{width:18px;text-align:center}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi-card{background:var(--bg3);border-radius:var(--radius2);padding:13px;transition:all 0.2s;border:1px solid transparent}
.kpi-card:hover{border-color:var(--border2)}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;margin-bottom:5px}
.kpi-value{font-size:24px;font-weight:600}
.kpi-value.blue{color:var(--blue)}.kpi-value.green{color:var(--green)}.kpi-value.orange{color:var(--orange)}.kpi-value.purple{color:var(--purple)}.kpi-value.red{color:var(--red)}
.kpi-sub{font-size:10px;color:var(--text2);margin-top:3px}
.panel{background:var(--bg3);border-radius:var(--radius2);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.panel-title{font-size:12px;font-weight:600}
.panel-badge{font-size:10px;padding:3px 7px;border-radius:6px;background:var(--bg5);color:var(--text2)}
.panel-body{padding:10px}
.btc-banner{grid-column:1/-1;background:linear-gradient(135deg,#f7931a,#ff9500);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.btc-left{display:flex;align-items:center;gap:16px}
.btc-icon{font-size:32px}
.btc-label{font-size:11px;color:rgba(255,255,255,0.8);margin-bottom:2px}
.btc-price{font-size:32px;font-weight:700}
.btc-change{font-size:14px;margin-top:2px}
.btc-right{text-align:right}
.btc-fng{font-size:11px;opacity:0.8}
.btc-fng-val{font-size:20px;font-weight:600}
.btc-updated{font-size:10px;opacity:0.6;margin-top:4px}
.agent-list{display:flex;flex-direction:column;gap:6px}
.agent-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:var(--radius2);cursor:pointer;transition:all 0.15s}
.agent-row:hover{background:var(--bg4)}
.agent-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.agent-dot.green{background:var(--green);box-shadow:0 0 7px var(--green);animation:pulse 2s infinite}
.agent-dot.orange{background:var(--orange)}
.agent-dot.blue{background:var(--blue)}
.agent-dot.red{background:var(--red)}
.agent-dot.grey{background:var(--text3)}
.agent-info{flex:1;min-width:0}
.agent-name{font-weight:500;margin-bottom:2px}
.agent-task{font-size:11px;color:var(--text2)}
.agent-meta{display:flex;gap:10px;font-size:10px;color:var(--text3)}
.agent-cost{color:var(--green);font-weight:500}
.agent-status{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--bg4)}
.trades-table{width:100%;border-collapse:collapse}
.trades-table th{text-align:left;padding:8px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border)}
.trades-table td{padding:10px;font-size:12px;border-bottom:1px solid var(--border)}
.trades-table tr:last-child td{border:none}
.trades-table tr:hover td{background:var(--bg)}
.trade-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:500}
.trade-badge.win{background:rgba(52,199,89,0.15);color:var(--green)}
.trade-badge.loss{background:rgba(255,59,48,0.15);color:var(--red)}
.trade-badge.pending{background:rgba(0,122,255,0.15);color:var(--blue)}
.chart-container{display:flex;align-items:flex-end;gap:6px;height:80px;padding:8px 0}
.chart-bar{flex:1;background:var(--bg5);border-radius:3px 3px 0 0;position:relative;min-height:8px}
.chart-bar.today{background:var(--blue)}
.chart-bar .bar-fill{position:absolute;bottom:0;left:0;right:0;background:var(--blue);border-radius:3px 3px 0 0}
.chart-labels{display:flex;justify-content:space-between;padding:0 4px}
.chart-label{font-size:9px;color:var(--text3)}
.chart-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.chart-budget{font-size:11px}
.chart-budget-label{color:var(--text2)}
.chart-budget-val{font-weight:600}
.cron-table{width:100%;border-collapse:collapse}
.cron-table th{text-align:left;padding:8px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border)}
.cron-table td{padding:10px;font-size:11px;border-bottom:1px solid var(--border)}
.cron-status{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:500}
.cron-status.ready{background:rgba(52,199,89,0.15);color:var(--green)}
.cron-status.running{background:rgba(0,122,255,0.15);color:var(--blue)}
.cron-status.paused{background:rgba(255,149,0,0.15);color:var(--orange)}
.cron-status.overdue{background:rgba(255,59,48,0.15);color:var(--red)}
.channel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.channel-card{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border-radius:var(--radius2)}
.channel-icon{width:28px;height:28px;background:var(--bg4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.channel-info{flex:1}
.channel-name{font-size:12px;font-weight:500}
.channel-msgs{font-size:10px;color:var(--text2)}
.log-list{max-height:300px;overflow-y:auto}
.log-entry{display:flex;gap:8px;font-size:11px;padding:6px 0;border-bottom:1px solid var(--border2)}
.log-time{color:var(--text3);flex-shrink:0;min-width:60px}
.log-msg{color:var(--text2)}
.log-entry.success .log-msg{color:var(--green)}
.log-entry.warn .log-msg{color:var(--orange)}
.log-entry.error .log-msg{color:var(--red)}
.log-entry.info .log-msg{color:var(--blue)}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.risk-item{padding:10px;background:var(--bg);border-radius:var(--radius2);text-align:center}
.risk-label{font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.risk-value{font-size:18px;font-weight:600}
.risk-value.good{color:var(--green)}.risk-value.warn{color:var(--orange)}.risk-value.bad{color:var(--red)}
.actions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;background:var(--bg3);border-radius:var(--radius2);cursor:pointer;transition:all 0.15s;border:1px solid transparent}
.action-btn:hover{background:var(--bg4);border-color:var(--border2);transform:translateY(-2px)}
.action-icon{font-size:20px}
.action-label{font-size:10px;color:var(--text2);text-align:center}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.section{display:none}
.section.active{display:block}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:none}
.setting-label{font-size:12px}
.setting-desc{font-size:10px;color:var(--text3);margin-top:2px}
.toggle{width:40px;height:22px;background:var(--bg5);border-radius:11px;position:relative;cursor:pointer;transition:background 0.2s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform 0.2s}
.toggle.on::after{transform:translateX(18px)}
.select-input{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.session-list{display:flex;flex-direction:column;gap:6px}
.session-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:var(--radius2)}
.session-id{font-size:11px;color:var(--text2);font-family:monospace}
.session-model{font-size:10px;padding:2px 6px;background:var(--bg4);border-radius:4px}
.session-time{font-size:10px;color:var(--text3)}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.health-card{background:var(--bg);padding:12px;border-radius:var(--radius2);text-align:center}
.health-label{font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.health-value{font-size:20px;font-weight:600}
.health-value.good{color:var(--green)}.health-value.warn{color:var(--orange)}.health-value.bad{color:var(--red)}
.signal-list{display:flex;flex-direction:column;gap:8px}
.signal-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:var(--radius2)}
.signal-icon{font-size:20px}
.signal-info{flex:1}
.signal-pair{font-weight:500}
.signal-details{font-size:10px;color:var(--text2)}
.signal-action{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px}
.signal-action.buy{background:rgba(52,199,89,0.2);color:var(--green)}
.signal-action.sell{background:rgba(255,59,48,0.2);color:var(--red)}
.signal-action.hold{background:rgba(0,122,255,0.2);color:var(--blue)}
.memory-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.memory-fill{height:100%;background:var(--blue);border-radius:4px;transition:width 0.3s}
.device-list{display:flex;flex-direction:column;gap:8px}
.device-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.device-icon{width:40px;height:40px;background:var(--bg4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.device-info{flex:1}
.device-name{font-weight:500;font-size:13px}
.device-type{font-size:11px;color:var(--text3)}
.device-status{font-size:10px;padding:3px 8px;border-radius:6px}
.device-status.online{background:rgba(52,199,89,0.15);color:var(--green)}
.device-status.offline{background:rgba(255,59,48,0.15);color:var(--red)}
.network-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.network-stat{background:var(--bg);padding:12px;border-radius:var(--radius2);text-align:center}
.network-stat-label{font-size:9px;color:var(--text3);text-transform:uppercase}
.network-stat-value{font-size:18px;font-weight:600;margin-top:4px}
.backup-list{display:flex;flex-direction:column;gap:8px}
.backup-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.backup-icon{width:36px;height:36px;background:var(--bg4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.backup-info{flex:1}
.backup-name{font-weight:500;font-size:13px}
.backup-date{font-size:11px;color:var(--text3)}
.backup-size{font-size:11px;color:var(--text2)}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.alert-icon{font-size:20px}
.alert-info{flex:1}
.alert-title{font-weight:500;font-size:13px}
.alert-desc{font-size:11px;color:var(--text3)}
.alert-toggle{width:36px;height:20px;background:var(--bg5);border-radius:10px;position:relative;cursor:pointer}
.alert-toggle.on{background:var(--green)}
.alert-toggle::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform 0.2s}
.alert-toggle.on::after{transform:translateX(16px)}
.report-list{display:flex;flex-direction:column;gap:8px}
.report-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2);cursor:pointer;transition:all 0.15s}
.report-row:hover{background:var(--bg4)}
.report-icon{width:36px;height:36px;background:var(--bg4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.report-info{flex:1}
.report-name{font-weight:500;font-size:13px}
.report-date{font-size:11px;color:var(--text3)}
.audit-list{display:flex;flex-direction:column;gap:6px}
.audit-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:var(--radius2);font-size:12px}
.audit-time{color:var(--text3);min-width:70px;font-size:11px}
.audit-user{color:var(--blue);font-weight:500}
.audit-action{color:var(--text2)}
.audit-target{color:var(--purple)}
.api-list{display:flex;flex-direction:column;gap:8px}
.api-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.api-icon{width:36px;height:36px;background:var(--bg4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.api-info{flex:1}
.api-name{font-weight:500;font-size:13px}
.api-endpoint{font-size:11px;color:var(--text3);font-family:monospace}
.api-status{font-size:10px;padding:3px 8px;border-radius:6px}
.api-status.active{background:rgba(52,199,89,0.15);color:var(--green)}
.api-status.inactive{background:rgba(99,99,102,0.15);color:var(--text3)}
.user-list{display:flex;flex-direction:column;gap:8px}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.user-avatar{width:40px;height:40px;background:var(--bg4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.user-info{flex:1}
.user-name{font-weight:500;font-size:13px}
.user-email{font-size:11px;color:var(--text3)}
.user-role{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--bg5);color:var(--text2)}
.skill-list{display:flex;flex-direction:column;gap:8px}
.skill-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius2)}
.skill-icon{width:40px;height:40px;background:var(--bg4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.skill-info{flex:1}
.skill-name{font-weight:500;font-size:13px}
.skill-desc{font-size:11px;color:var(--text3)}
.skill-status{font-size:10px;padding:3px 8px;border-radius:6px}
.skill-status.active{background:rgba(52,199,89,0.15);color:var(--green)}
.skill-status.inactive{background:rgba(99,99,102,0.15);color:var(--text3)}
@media(max-width:1000px){.dashboard{grid-template-columns:1fr}.sidebar{display:none}.kpi-row{grid-template-columns:repeat(3,1fr)}.three-col,.two-col{grid-template-columns:1fr}.health-grid,.network-stats{grid-template-columns:repeat(2,1fr)}}
#loginOverlay{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:radial-gradient(ellipse at 20% 20%,rgba(0,122,255,0.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(175,82,222,0.15) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(52,199,89,0.08) 0%,transparent 60%),linear-gradient(135deg,#0a0a0c,#1a1a1e 50%,#0d0d0f);background-size:200% 200%,200% 200%,100% 100%;animation:gradientShift 15s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0 0,100% 100%,50% 50%,0 0}50%{background-position:100% 100%,0 0,50% 50%,0 0}}
.login-container{background:rgba(28,28,30,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:360px;max-width:90vw;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.05) inset,0 8px 32px rgba(0,122,255,0.1);animation:slideUp 0.4s ease-out,fadeIn 0.3s ease-out;position:relative;overflow:hidden}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.login-container::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,122,255,0.5),transparent)}
.login-logo{width:48px;height:48px;background:linear-gradient(135deg,#007AFF,#AF52DE);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,122,255,0.3);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(0,122,255,0.3)}50%{box-shadow:0 8px 32px rgba(0,122,255,0.5)}}
.login-title{font-size:26px;font-weight:600;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,#fff,#98989d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-subtitle{font-size:13px;color:var(--text2);text-align:center;margin-bottom:28px}
.login-form{display:flex;flex-direction:column;gap:16px}
.input-group{position:relative}
.input-group label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.input-wrapper{position:relative}
.input-wrapper input{width:100%;padding:14px 44px 14px 14px;background:rgba(13,13,15,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:var(--text);font-size:15px;transition:all 0.2s;outline:none}

<script>
const SECURITY={MAX_ATTEMPTS:5,LOCKOUT_DURATION:5*60*1000,SESSION_TIMEOUT:30*60*1000,CSRF_TOKEN_LENGTH:32};
const VALID_USER_HASH='19f04r';
const VALID_PASS_HASH='ndk4h3';
const SESSION_KEY='hifty_mc_session';
const RATE_LIMIT_KEY='hifty_rate_limit';
const CSRF_KEY='hifty_csrf';
let loginAttempts=0,lockoutUntil=0,currentCaptcha=null,sessionActivityTime=Date.now();

function generateCSRFToken(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let t='';for(let i=0;i<SECURITY.CSRF_TOKEN_LENGTH;i++){t+=c.charAt(Math.floor(Math.random()*c.length))}return t}
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return Math.abs(h).toString(36)}
function sanitizeInput(s){if(typeof s!=='string')return'';return s.replace(/[<>'"]/g,'').trim().substring(0,100)}
function getFingerprint(){return simpleHash([navigator.userAgent,navigator.language,screen.width+'x'+screen.height,new Date().getTimezoneOffset()].join('|'))}
function initCSRF(){let csrf=localStorage.getItem(CSRF_KEY);if(!csrf){csrf=generateCSRFToken();localStorage.setItem(CSRF_KEY,csrf)}return csrf}
function getRateLimit(){const s=localStorage.getItem(RATE_LIMIT_KEY);if(s){const d=JSON.parse(s);if(Date.now()<d.lockoutUntil)return d;localStorage.removeItem(RATE_LIMIT_KEY)}return{attempts:0,lockoutUntil:0}}
function updateRateLimit(a){const d={attempts:a,lockoutUntil:a>=SECURITY.MAX_ATTEMPTS?Date.now()+SECURITY.LOCKOUT_DURATION:0};localStorage.setItem(RATE_LIMIT_KEY,JSON.stringify(d));return d}
function checkPasswordStrength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[A-Z]/.test(p))s++;if(/[a-z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s}
function getPasswordStrengthClass(s){if(s<=1)return'weak';if(s<=2)return'fair';if(s<=3)return'good';return'strong'}
function getPasswordStrengthText(s){if(s<=1)return'Very Weak';if(s<=2)return'Weak';if(s<=3)return'Good';return'Strong'}
function generateCaptcha(){const a=Math.floor(Math.random()*10)+1;const b=Math.floor(Math.random()*10)+1;const ops=['+','-','*'];const op=ops[Math.floor(Math.random()*ops.length)];let answer;switch(op){case'+':answer=a+b;break;case'-':answer=a-b;break;case'*':answer=a*b;break}return{question:a+' '+op+' '+b+' = ?',answer:answer.toString()}}
function checkSession(){const s=localStorage.getItem(SESSION_KEY);if(s){try{const d=JSON.parse(s);if(d.loggedIn&&d.user===VALID_USER_HASH){if(Date.now()-d.lastActivity<SECURITY.SESSION_TIMEOUT){sessionActivityTime=d.lastActivity;return true}else{localStorage.removeItem(SESSION_KEY)}}}catch(e){}}return false}
function login(u,p,remember){const uh=simpleHash(u),ph=simpleHash(p);if(uh===VALID_USER_HASH&&ph===VALID_PASS_HASH){localStorage.setItem(SESSION_KEY,JSON.stringify({loggedIn:true,user:uh,time:Date.now(),lastActivity:Date.now(),fingerprint:getFingerprint(),remember:remember||false}));return true}return false}
function logout(){localStorage.removeItem(SESSION_KEY);sessionActivityTime=Date.now();showLogin()}
function showLogin(){document.getElementById('loginOverlay').style.display='flex';document.getElementById('dashboard').style.display='none';document.getElementById('signOutBtn').style.display='none';initLoginForm()}
function showDashboard(){document.getElementById('loginOverlay').style.display='none';document.getElementById('dashboard').style.display='grid';document.getElementById('signOutBtn').style.display='flex';startSessionMonitor()}
function initLoginForm(){const csrf=initCSRF();const rate=getRateLimit();loginAttempts=rate.attempts;lockoutUntil=rate.lockoutUntil;document.getElementById('loginUser').value='';document.getElementById('loginPass').value='';document.getElementById('loginError').classList.remove('visible');document.getElementById('loginError').textContent='';document.getElementById('captchaContainer').classList.remove('visible');document.getElementById('loginUser').disabled=false;document.getElementById('loginPass').disabled=false;document.getElementById('loginBtn').disabled=false;document.getElementById('loginBtn').classList.remove('loading');document.getElementById('loginBtn').textContent='Sign In';updateLockoutStatus();if(loginAttempts>=2){showCaptcha()}}
function updateLockoutStatus(){const lockoutEl=document.getElementById('lockoutMessage');if(Date.now()<lockoutUntil){const remaining=Math.ceil((lockoutUntil-Date.now())/1000);lockoutEl.classList.add('visible');lockoutEl.textContent='Too many attempts. Try again in '+Math.ceil(remaining/60)+' minute(s).';document.getElementById('loginBtn').disabled=true;document.getElementById('loginUser').disabled=true;document.getElementById('loginPass').disabled=true;setTimeout(updateLockoutStatus,1000);return true}else{lockoutEl.classList.remove('visible');lockoutEl.textContent='';return false}}
function showCaptcha(){document.getElementById('captchaContainer').classList.add('visible');currentCaptcha=generateCaptcha();document.getElementById('captchaQuestion').textContent=currentCaptcha.question;document.getElementById('captchaAnswer').value=''}
function handleLogin(e){e.preventDefault();if(updateLockoutStatus())return;const user=sanitizeInput(document.getElementById('loginUser').value);const pass=document.getElementById('loginPass').value;const remember=document.getElementById('rememberMe').checked;const errorEl=document.getElementById('loginError');if(!user||!pass){errorEl.textContent='Please enter both username and password';errorEl.classList.add('visible');return}
if(loginAttempts>=2&&currentCaptcha){const captchaAnswer=document.getElementById('captchaAnswer').value;if(captchaAnswer!==currentCaptcha.answer){errorEl.textContent='Incorrect captcha. Please try again.';errorEl.classList.add('visible');showCaptcha();return}}
document.getElementById('loginBtn').disabled=true;document.getElementById('loginBtn').classList.add('loading');document.getElementById('loginBtn').textContent='Signing in...';setTimeout(()=>{if(login(user,pass,remember)){errorEl.textContent='';errorEl.classList.remove('visible');updateRateLimit(0);showDashboard();init()}else{loginAttempts++;const rate=updateRateLimit(loginAttempts);errorEl.textContent='Invalid credentials. '+(SECURITY.MAX_ATTEMPTS-loginAttempts)+' attempts remaining.';errorEl.classList.add('visible');document.getElementById('loginBtn').disabled=false;document.getElementById('loginBtn').classList.remove('loading');document.getElementById('loginBtn').textContent='Sign In';if(loginAttempts>=2){showCaptcha()}}document.getElementById('loginPass').value=''},800)}
function togglePassword(){const p=document.getElementById('loginPass');const t=document.getElementById('togglePassword');if(p.type==='password'){p.type='text';t.textContent='🙈'}else{p.type='password';t.textContent='👁️'}}
function updatePasswordStrength(){const p=document.getElementById('loginPass').value;const s=document.getElementById('passwordStrength');const f=document.getElementById('strengthFill');const t=document.getElementById('strengthText');if(p.length>0){const strength=checkPasswordStrength(p);s.classList.add('visible');f.className='strength-fill '+getPasswordStrengthClass(strength);t.textContent=getPasswordStrengthText(strength)}else{s.classList.remove('visible')}}
function showHint(){document.getElementById('hintModal').classList.add('visible')}
function closeHint(){document.getElementById('hintModal').classList.remove('visible')}
function startSessionMonitor(){let idleTime=0;const idleInterval=setInterval(()=>{if(!checkSession()){clearInterval(idleInterval);logout();return}idleTime++;if(idleTime>=30){const elapsed=Date.now()-sessionActivityTime;if(elapsed>=SECURITY.SESSION_TIMEOUT){clearInterval(idleInterval);alert('Session expired due to inactivity. Please log in again.');logout();return}}},60000);document.addEventListener('click',()=>{sessionActivityTime=Date.now();idleTime=0});document.addEventListener('keypress',()=>{sessionActivityTime=Date.now();idleTime=0})}
if(checkSession()){document.write('<style>#loginOverlay{display:none}#dashboard{display:grid}</style>')}else{document.write('<style>#loginOverlay{display:flex}#dashboard{display:none}</style>')}
<\/script>

function jitter(v,r){return Math.max(0,Math.min(100,v+(Math.random()-0.5)*r))}
function updateResources(){const c=jitter(12,8),r=jitter(34,6),d=jitter(67,3);document.getElementById('cpuBar').style.width=c+'%';document.getElementById('ramBar').style.width=r+'%';document.getElementById('diskBar').style.width=d+'%';document.getElementById('cpuBar').className='res-fill '+(c>80?'high':c>60?'med':'low');document.getElementById('ramBar').className='res-fill '+(r>80?'high':r>60?'med':'low');document.getElementById('diskBar').className='res-fill '+(d>80?'high':d>60?'med':'low')}updateResources();setInterval(updateResources,3000);
