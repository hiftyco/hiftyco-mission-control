<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Chat</title>
<style>
:root{
--bg:#0a0a0f;--bg1:#111118;--bg2:#18181f;--bg3:#1f1f28;--bg4:#26262f;
--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
--text:#f0f0f5;--muted:#8e8ea8;--hint:#4a4a60;
--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
--mono:'SF Mono',Monaco,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:32px 32px;pointer-events:none;z-index:0}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}

.header{height:56px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.h-left{display:flex;align-items:center;gap:12px}
.h-logo{width:34px;height:34px;background:rgba(10,132,255,0.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.h-title{font-size:15px;font-weight:600}
.h-subtitle{font-size:11px;font-family:var(--mono);color:var(--hint)}
.h-center{display:flex;align-items:center;gap:8px}
.status-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px}
.status-pill.polling{background:rgba(48,209,88,0.15);color:var(--green)}
.status-pill.error{background:rgba(255,69,58,0.15);color:var(--red)}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.status-time{font-size:10px;color:var(--hint);margin-left:4px}
.h-right{display:flex;align-items:center;gap:8px}
.h-btn{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all 0.15s}
.h-btn:hover{background:var(--bg3);color:var(--text)}
.h-link{font-size:12px;color:var(--blue);text-decoration:none;padding:6px 10px}

.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}

.msg{display:flex;max-width:72%;animation:fadeSlideUp 0.2s ease}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg.user .msg-bubble{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px}
.msg.openclaw{max-width:72%;margin-right:auto}
.msg.openclaw .msg-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 18px 4px}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:rgba(10,132,255,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:8px;flex-shrink:0}
.msg.user .msg-avatar{display:none}
.msg-content{display:flex;flex-direction:column;gap:2px}
.msg-time{font-size:10px;opacity:0.7;padding:0 4px}
.msg.user .msg-time{text-align:right}
.msg.openclaw .msg-time{color:var(--hint)}

.date-sep{display:flex;align-items:center;gap:12px;margin:12px 0;color:var(--hint);font-size:11px}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--border)}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px)}}

.typing{display:none;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 18px 4px;width:fit-content}
.typing.show{display:flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;background:var(--hint);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.15s}
.typing span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:1}}

.system{text-align:center;font-size:11px;color:var(--muted);padding:4px}

.input-bar{background:var(--bg1);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:10px;padding:12px 16px;flex-shrink:0}
.input-bar textarea{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-family:inherit;font-size:14px;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.4}
.input-bar textarea::placeholder{color:var(--hint)}
.input-bar textarea:focus{border-color:var(--border2)}
.input-bar button{height:40px;padding:0 16px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.input-bar button:hover{background:var(--bg4);color:var(--text)}
.input-bar button.send{width:40px;padding:0;background:var(--blue);border-color:var(--blue);color:#fff;border-radius:50%;justify-content:center;font-size:16px}
.input-bar button.send:hover{opacity:0.85}
.input-bar button.send:active{transform:scale(0.95)}
.input-bar button.send:disabled{opacity:0.4;cursor:not-allowed}
.input-bar button.abort{background:rgba(255,69,58,0.15);border-color:rgba(255,69,58,0.25);color:var(--red);font-size:12px;padding:8px 14px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;transform:scale(0.95);transition:transform 0.2s}
.modal.show .modal-card{transform:scale(1)}
.modal-title{font-size:18px;font-weight:600;margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.modal-field{margin-bottom:16px}
.modal-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:block}
.modal-input{width:100%;padding:12px 14px;background:var(--bg1);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none}
.modal-input:focus{border-color:var(--blue)}
.modal-link{font-size:12px;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-top:8px}
.modal-link:hover{text-decoration:underline}
.modal-btn{width:100%;padding:14px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.modal-btn:hover{background:#0095ff}
.modal-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center}

@media(max-width:500px){
.header{padding:0 12px}
.h-subtitle,.status-time,.h-link{display:none}
.messages{padding:12px}
.msg{max-width:88%}
.input-bar{padding:10px}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="h-left">
<div class="h-logo">🦞</div>
<div>
<div class="h-title">OpenClaw Chat</div>
<div class="h-subtitle">via Telegram</div>
</div>
</div>
<div class="h-center">
<div class="status-pill error" id="statusPill"><span class="status-dot"></span><span id="statusText">Not connected</span><span class="status-time" id="statusTime"></span></div>
</div>
<div class="h-right">
<a href="index.html" class="h-link">← Dashboard</a>
<button class="h-btn" onclick="showSetup()">⚙️</button>
</div>
</header>

<div class="messages" id="messages">
<div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>

<div class="input-bar">
<textarea id="input" placeholder="Message OpenClaw…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
<button class="abort" id="abortBtn" onclick="sendStop()" style="display:none">⏹️ Stop</button>
<button class="send" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
</div>
</div>

<div class="modal" id="setupModal">
<div class="modal-card">
<div class="modal-title">🔧 Connect Telegram</div>
<div class="modal-desc">Enter your bot token and chat ID to enable messaging</div>
<div class="modal-field">
<label class="modal-label">Bot Token</label>
<input type="password" class="modal-input" id="botToken" placeholder="1234567890:ABCdefGHIjklMNOpqrsTUVwxyz">
</div>
<div class="modal-field">
<label class="modal-label">Chat ID</label>
<input type="text" class="modal-input" id="chatId" placeholder="7140076919">
</div>
<div class="modal-field">
<label class="modal-label">Your Name</label>
<input type="text" class="modal-input" id="userName" placeholder="Mango">
</div>
<a href="https://t.me/userinfobot" target="_blank" class="modal-link">How to get Chat ID →</a>
<button class="modal-btn" onclick="saveSettings()">Connect</button>
<div class="modal-error" id="modalError"></div>
</div>
</div>

<script>
// Constants
const TG_API='https://api.telegram.org/bot';
const POLL_INTERVAL_ACTIVE=2000;
const POLL_INTERVAL_IDLE=8000;
const POLL_TIMEOUT=25;
const MAX_MESSAGES=100;

// State
let offset=0;
let polling=false;
let lastActivity=Date.now();
let pendingReply=false;
let pollTimer=null;
let myMessageIds=new Set();

// Load config
function loadConfig(){
const token=localStorage.getItem('oc_bot_token');
const chatId=localStorage.getItem('oc_chat_id');
if(token&&chatId){
document.getElementById('botToken').value=token;
document.getElementById('chatId').value=chatId;
document.getElementById('userName').value=localStorage.getItem('oc_user_name')||'Mango';
restoreHistory();
startPolling();
}else{
showSetup();
}
}

// Show setup modal
function showSetup(){
document.getElementById('setupModal').classList.add('show');
document.getElementById('modalError').textContent='';
}

// Save settings
function saveSettings(){
const token=document.getElementById('botToken').value.trim();
const chatId=document.getElementById('chatId').value.trim();
const name=document.getElementById('userName').value.trim()||'Mango';
if(!token||!chatId){
document.getElementById('modalError').textContent='Please fill in all fields';
return;
}
localStorage.setItem('oc_bot_token',token);
localStorage.setItem('oc_chat_id',chatId);
localStorage.setItem('oc_user_name',name);
document.getElementById('setupModal').classList.remove('show');
startPolling();
}

// Restore message history
function restoreHistory(){
try{
const msgs=JSON.parse(localStorage.getItem('oc_messages')||'[]');
const container=document.getElementById('messages');
msgs.forEach(m=>appendMessage(m.role,m.text,m.ts,false));
}catch(e){}
}

// Save message history
function saveHistory(){
const container=document.getElementById('messages');
const msgs=[];
container.querySelectorAll('.msg').forEach(el=>{
const role=el.classList.contains('user')?'user':'openclaw';
const text=el.querySelector('.msg-bubble').textContent;
msgs.push({role,text});
});
if(msgs.length>MAX_MESSAGES)msgs.splice(0,msgs.length-MAX_MESSAGES);
localStorage.setItem('oc_messages',JSON.stringify(msgs));
}

// Append message
function appendMessage(role,text,ts,save=true){
const typing=document.getElementById('typing');
const msg=document.createElement('div');
msg.className='msg '+(role==='user'?'user':'openclaw');
msg.innerHTML=role==='openclaw'?'<div class="msg-avatar">🦞</div>':'';
msg.innerHTML+=`<div class="msg-content"><div class="msg-bubble">${renderMarkdown(text)}</div><div class="msg-time">${fmtTime(ts)}</div></div>`;
document.getElementById('messages').insertBefore(msg,typing);
document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
if(save)saveHistory();
}

// Render markdown
function renderMarkdown(text){
return text
.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
.replace(/`([^`]+)`/g,'<code>$1</code>')
.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
.replace(/\*([^*]+)\*/g,'<em>$1</em>')
.replace(/\n/g,'<br>');
}

// Format time
function fmtTime(ms){
return new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// Clear input
function clearInput(){
document.getElementById('input').value='';
document.getElementById('input').style.height='auto';
document.getElementById('sendBtn').disabled=true;
}

// Input handler
document.getElementById('input').addEventListener('input',function(){
this.style.height='auto';
this.style.height=Math.min(this.scrollHeight,120)+'px';
document.getElementById('sendBtn').disabled=!this.value.trim();
});

// Show typing
function showTyping(){
document.getElementById('typing').classList.add('show');
document.getElementById('abortBtn').style.display='block';
document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}

// Hide typing
function hideTyping(){
document.getElementById('typing').classList.remove('show');
document.getElementById('abortBtn').style.display='none';
}

// Send message
async function sendMessage(){
const input=document.getElementById('input');
const text=input.value.trim();
if(!text)return;

const token=localStorage.getItem('oc_bot_token');
const chatId=localStorage.getItem('oc_chat_id');
if(!token||!chatId){showSetup();return;}

appendMessage('user',text,Date.now());
clearInput();
showTyping();
pendingReply=true;
lastActivity=Date.now();

try{
const res=await fetch(TG_API+token+'/sendMessage',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chat_id:chatId,text:text,parse_mode:'Markdown'})
});
const data=await res.json();
if(!data.ok)throw new Error(data.description);
myMessageIds.add(data.result.message_id);
}catch(err){
hideTyping();
pendingReply=false;
showSystem('Send failed: '+err.message);
}
}

// Send stop
async function sendStop(){
const token=localStorage.getItem('oc_bot_token');
const chatId=localStorage.getItem('oc_chat_id');
if(!token||!chatId)return;
try{
await fetch(TG_API+token+'/sendMessage',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chat_id:chatId,text:'/stop'})
});
}catch(e){}
hideTyping();
pendingReply=false;
showSystem('Stopped');
}

// Show system message
function showSystem(text){
const container=document.getElementById('messages');
const el=document.createElement('div');
el.className='system';
el.textContent=text;
container.insertBefore(el,document.getElementById('typing'));
}

// Update status
function updateStatusPill(status){
const pill=document.getElementById('statusPill');
const text=document.getElementById('statusText');
const time=document.getElementById('statusTime');
if(status==='polling'){
pill.className='status-pill polling';
text.textContent='● Polling';
time.textContent='Updated just now';
}else{
pill.className='status-pill error';
text.textContent='✕ '+status;
}
}

// Start polling
function startPolling(){
if(polling)return;
polling=true;
updateStatusPill('polling');
poll();
}

// Poll
async function poll(){
if(!polling)return;
const token=localStorage.getItem('oc_bot_token');
const chatId=localStorage.getItem('oc_chat_id');
if(!token||!chatId){polling=false;return;}

try{
const url=TG_API+token+'/getUpdates?offset='+(offset||0)+'&timeout='+POLL_TIMEOUT+'&allowed_updates=["message"]';
const res=await fetch(url);
const data=await res.json();
if(!data.ok)throw new Error(data.description);

data.result.forEach(update=>{
offset=update.update_id+1;
const msg=update.message;
if(!msg)return;
if(myMessageIds.has(msg.message_id)){myMessageIds.delete(msg.message_id);return;}
if(String(msg.chat.id)!==String(chatId))return;
hideTyping();
pendingReply=false;
appendMessage('openclaw',msg.text,msg.date*1000);
});

updateStatusPill('polling');
}catch(err){
updateStatusPill('Error');
}finally{
const interval=(Date.now()-lastActivity>60000)?POLL_INTERVAL_IDLE:POLL_INTERVAL_ACTIVE;
pollTimer=setTimeout(poll,interval);
}
}

// Init
loadConfig();

// Update relative time
setInterval(()=>{
if(polling){
document.getElementById('statusTime').textContent='Updated '+Math.round((Date.now()-lastActivity)/1000)+'s ago';
}
},5000);
</script>
</body>
</html>
